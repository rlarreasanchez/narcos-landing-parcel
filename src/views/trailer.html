<section class="section" id="trailer" aria-labelledby="trailer-title">
  <div class="container" data-aos="fade-up">
    <h2 class="section__title" id="trailer-title">Tráiler</h2>
    <div class="section__body section__body--wide">
      <div class="video">
        <iframe
          class="video__frame"
          src="https://www.youtube-nocookie.com/embed/VNP2znpZvUE"
          title="Tráiler oficial de Narcos (YouTube)"
          loading="lazy"
          allow="
            accelerometer;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
      <p class="section__text section__text--center">
        ¿No se reproduce el vídeo?
        <a href="https://www.youtube.com/watch?v=VNP2znpZvUE"
          >Ábrelo en YouTube</a
        >.
      </p>
      <div class="theme-song">
        <h3 class="theme-song__title">La sintonía</h3>
        <p class="theme-song__text">
          «Tuyo», de Rodrigo Amarante, en la cabecera oficial de la serie.
        </p>
        <div class="theme-song__player video video--compact" hidden></div>
        <div class="theme-song__actions">
          <button class="button theme-song__play" type="button" hidden>
            <i class="fa-solid fa-play" aria-hidden="true"></i>
            Escuchar la sintonía
          </button>
          <button class="theme-song__close" type="button" hidden>
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            Cerrar reproductor
          </button>
        </div>
        <p class="theme-song__notice" hidden>
          Al pulsar se carga un reproductor de YouTube.
        </p>
        <a
          class="theme-song__fallback"
          href="https://www.youtube.com/watch?v=PtJ6yAGjsIs"
          target="_blank"
          rel="noopener noreferrer"
        >
          Escuchar en YouTube
        </a>
      </div>
    </div>
  </div>
</section>
