<section class="hero" aria-labelledby="hero-title">
  <picture class="hero__media">
    <source
      type="image/webp"
      media="(max-width: 767px)"
      srcset="
        ./assets/images/hero-mobile.jpg?as=webp&width=480   480w,
        ./assets/images/hero-mobile.jpg?as=webp&width=800   800w,
        ./assets/images/hero-mobile.jpg?as=webp&width=1000 1000w
      "
      sizes="100vw"
    />
    <source
      type="image/webp"
      srcset="
        ./assets/images/hero.jpg?as=webp&width=640   640w,
        ./assets/images/hero.jpg?as=webp&width=1024 1024w,
        ./assets/images/hero.jpg?as=webp&width=1600 1600w,
        ./assets/images/hero.jpg?as=webp&width=2400 2400w
      "
      sizes="100vw"
    />
    <img
      class="hero__image"
      src="./assets/images/hero.jpg?width=1600"
      alt="Imagen promocional de la serie Narcos"
      width="1600"
      height="900"
      fetchpriority="high"
    />
  </picture>
  <div class="hero__content container">
    <p class="hero__meta">Serie original de Netflix · 2015–2017</p>
    <h1 class="hero__title" id="hero-title">Narcos</h1>
    <p class="hero__subtitle">
      El ascenso y la caída de Pablo Escobar y de los grandes cárteles de
      Colombia, contados a lo largo de tres temporadas.
    </p>
    <a class="button hero__cta" href="#temporadas">
      Descubre las temporadas
      <i class="button__icon fa-solid fa-arrow-down" aria-hidden="true"></i>
    </a>
  </div>
</section>
